id: "53"
title: Maximum Subarray
slug: maximum-subarray
leetcode_url: https://leetcode.com/problems/maximum-subarray/
category: greedy
difficulty: Medium
patterns: [Kadane's Algorithm, Greedy, 1-D DP]

description: |
  Given an integer array `nums`, find the **contiguous**, **non-empty** subarray with the largest sum and return that sum.

  A subarray is a block of consecutive elements, such as `nums[2..5]`. It must contain at least one element, so if every number is negative the answer is the largest (least negative) single element, not `0`.

examples:
  - input: { nums: [-2, 1, -3, 4, -1, 2, 1, -5, 4] }
    output: 6
    explanation: |
      The subarray `[4, -1, 2, 1]` has sum 6. It includes the `-1`: dipping briefly is worth it because the elements after it more than make up for the loss.
  - input: { nums: [1] }
    output: 1
    explanation: |
      The only non-empty subarray is the whole array.
  - input: { nums: [5, 4, -1, 7, 8] }
    output: 23
    explanation: |
      The whole array is the best subarray: `5 + 4 - 1 + 7 + 8 = 23`.

constraints:
  - "`1 <= nums.length <= 10^5`"
  - "`-10^4 <= nums[i] <= 10^4`"

function_signature: "def maxSubArray(self, nums: List[int]) -> int"

starter_code: |
  class Solution:
      def maxSubArray(self, nums: List[int]) -> int:
          pass

runner:
  kind: function
  method: maxSubArray
  params:
    - { name: nums, type: "List[int]" }
  returns: int

hints:
  - Trying every start and end is O(n²). Ask a narrower question instead. For each index `i`, what is the best sum of a subarray that *ends exactly at* `i`?
  - The best subarray ending at `i` is either `nums[i]` on its own, or `nums[i]` added to the best subarray ending at `i - 1`. When does continuing the previous subarray help, and when does it hurt?
  - Continuing only helps if the running sum so far is positive. Keep a running sum. Whenever it has dropped below zero, throw it away and start fresh at the current element. Track the largest running sum you ever see.

approach: Kadane's algorithm
optimal_solution: |
  class Solution:
      def maxSubArray(self, nums: List[int]) -> int:
          best = nums[0]   # best subarray sum seen so far (never empty, so not 0)
          current = 0      # sum of the best subarray ending at the current element

          for x in nums:
              # A negative running sum can only drag down whatever follows it,
              # so drop it and start a new subarray at x.
              if current < 0:
                  current = 0
              current += x
              best = max(best, current)

          return best

explanation: |
  **Intuition.** Let `current` be the best sum of a subarray that *ends at the current element*. When the next element `x` arrives there are only two options. Either the subarray continues (sum `current + x`) or a new one starts at `x` (sum `x`). Continuing is at least as good exactly when `current >= 0`. So the whole algorithm boils down to one rule: **if the running sum has gone negative, cut it loose.**

  **Why the greedy cut is safe.** Suppose the running sum of the current stretch `nums[s..i]` is negative. Any subarray that starts at `s` and continues past `i`, say `nums[s..k]`, is that negative stretch plus `nums[i+1..k]`. Dropping the negative stretch strictly increases the sum, so the best subarray never begins with it, and discarding it loses nothing. A non-negative running sum never hurts, so keeping it is safe too.

  The same thing seen as DP: `current` after index `i` equals `dp[i] = max(nums[i], dp[i - 1] + nums[i])`, the best sum of a subarray ending at `i`. The overall answer is `max(dp[i])` over all `i`. Kadane's algorithm is this 1-D DP with only the previous value kept.

  **Algorithm.**
  1. Set `best = nums[0]` and `current = 0`.
  2. For each `x` in `nums`: if `current < 0` reset it to `0`, then add `x`, then set `best = max(best, current)`.
  3. Return `best`.

  Trace for `[-2, 1, -3, 4, -1, 2, 1, -5, 4]`:

  | `x`       | -2 | 1 | -3 | 4 | -1 | 2 | 1 | -5 | 4 |
  |-----------|----|---|----|---|----|---|---|----|---|
  | `current` | -2 | 1 | -2 | 4 | 3  | 5 | 6 | 1  | 5 |
  | `best`    | -2 | 1 | 1  | 4 | 4  | 5 | **6** | 6 | 6 |

  **Subtle points.**
  - **All negatives.** The subarray cannot be empty, so initialise `best` with `nums[0]`, not `0`. For `[-3, -1, -2]` the answer is `-1`. Starting `best` at `0` is the most common bug.
  - Reset *before* adding `x` and compare *after*, so that a single element can be the whole answer.
  - Crossing a negative number can still pay off (`[2, -1, 2]` gives `3`). We only cut when the *whole running sum* is negative, not when one element is.
  - To return the subarray itself, also remember where `current` was last reset and where `best` was last improved.

key_insight: A running sum that has gone negative can only hurt whatever comes after it, so drop it and restart; the best sum ending at each index then needs O(1) work and O(1) memory.

time_complexity: O(n)
space_complexity: O(1)
complexity_explanation: |
  **Time O(n):** one pass over `nums`, doing a comparison, an addition and a `max` per element.

  **Space O(1):** only two integers, `current` and `best`, are stored no matter how long the input is. The DP table `dp[i]` is never materialised because each step needs only the previous value.

data_structures: [Array]
passes: 1 pass over nums

alternatives:
  - name: Brute force (every start, running sum)
    time_complexity: O(n²)
    space_complexity: O(1)
    explanation: |
      Fix each start index `i` and extend the end `j` one element at a time, adding `nums[j]` to a running total so each subarray sum costs O(1). Track the largest total. (Recomputing every sum from scratch would be O(n³).)
    tradeoff: Easy to get right and a good first answer to say out loud, but it examines all ~n²/2 subarrays. At n = 10^5 that is about 5·10^9 additions, while Kadane's algorithm needs 10^5.
    code: |
      class Solution:
          def maxSubArray(self, nums: List[int]) -> int:
              best = nums[0]
              n = len(nums)
              for i in range(n):
                  total = 0
                  for j in range(i, n):
                      total += nums[j]  # sum of nums[i..j], extended one element at a time
                      best = max(best, total)
              return best
  - name: Divide and conquer
    time_complexity: O(n log n)
    space_complexity: O(log n)
    explanation: |
      Split the array in half. The best subarray lies entirely in the left half, entirely in the right half, or **crosses the middle**. The first two cases are solved recursively. The crossing case is the best suffix of the left half plus the best prefix of the right half, found by scanning outward from the middle in O(length). Take the maximum of the three.
    tradeoff: Slower than Kadane (O(n log n) vs O(n)) and much more code. It is still worth knowing because its "combine" step (best suffix + best prefix) is exactly what a segment tree stores to answer maximum-subarray queries on ranges that change over time.
    code: |
      class Solution:
          def maxSubArray(self, nums: List[int]) -> int:
              def solve(lo: int, hi: int) -> int:
                  # Best subarray sum inside nums[lo..hi] (inclusive).
                  if lo == hi:
                      return nums[lo]
                  mid = (lo + hi) // 2

                  # Best sum crossing the middle = best suffix of the left half
                  # + best prefix of the right half (each takes at least one element).
                  left_best, total = -math.inf, 0
                  for i in range(mid, lo - 1, -1):
                      total += nums[i]
                      left_best = max(left_best, total)
                  right_best, total = -math.inf, 0
                  for i in range(mid + 1, hi + 1):
                      total += nums[i]
                      right_best = max(right_best, total)

                  return max(solve(lo, mid), solve(mid + 1, hi), left_best + right_best)

              return solve(0, len(nums) - 1)

tests:
  - { name: single negative, input: { nums: [-5] }, expected: -5 }
  - { name: all negatives, input: { nums: [-3, -1, -2] }, expected: -1 }
  - { name: all positives, input: { nums: [1, 2, 3, 4] }, expected: 10 }
  - { name: zero beats negatives, input: { nums: [-1, 0, -2] }, expected: 0 }
  - { name: dip worth crossing, input: { nums: [2, -1, 2] }, expected: 3 }
  - { name: dip not worth crossing, input: { nums: [3, -10, 4] }, expected: 4 }
  - { name: best subarray at the end, input: { nums: [8, -19, 5, -4, 20] }, expected: 21 }
  - { name: best subarray in the middle, input: { nums: [-2, -3, 4, -1, -2, 1, 5, -3] }, expected: 7 }
  - { name: boundary values, input: { nums: [-10000, 10000, -9999, 10000] }, expected: 10001 }
  - { name: alternating signs, input: { nums: [1, -1, 1, -1, 1, -1, 1] }, expected: 1 }

