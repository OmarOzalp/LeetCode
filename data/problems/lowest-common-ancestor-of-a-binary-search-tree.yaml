id: "235"
title: Lowest Common Ancestor of a Binary Search Tree
slug: lowest-common-ancestor-of-a-binary-search-tree
leetcode_url: https://leetcode.com/problems/lowest-common-ancestor-of-a-binary-search-tree/
category: trees
difficulty: Medium
patterns: [BST Property, Binary Search, Tree Walk]

description: |
  You are given the `root` of a **binary search tree** (BST) and two of its nodes, `p` and `q`. Return their **lowest common ancestor** (LCA).

  The LCA of `p` and `q` is the deepest node that has both `p` and `q` among its descendants. A node counts as a descendant of **itself**, so if `p` is an ancestor of `q`, the answer is `p`.

  Recall the BST property: for every node, all values in its left subtree are smaller than the node's value, and all values in its right subtree are larger.

  **How tests work:** `p` and `q` are written as node *values*. The runner looks up the nodes with those values in `root` and passes the actual nodes to your function. Your answer is checked by the value of the node you return.

examples:
  - input: { root: [6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], p: 2, q: 8 }
    output: 6
    explanation: "`2` is in the root's left subtree and `8` is in its right subtree, so the root `6` is the deepest node above both."
  - input: { root: [6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], p: 2, q: 4 }
    output: 2
    explanation: "`4` is a descendant of `2`, and `2` is a descendant of itself, so the LCA is `2`."
  - input: { root: [2, 1], p: 2, q: 1 }
    output: 2

constraints:
  - "The number of nodes in the tree is in the range `[2, 10^5]`."
  - "`-10^9 <= Node.val <= 10^9`"
  - "All `Node.val` are **unique**."
  - "`p != q`"
  - "`p` and `q` both exist in the BST."

function_signature: "def lowestCommonAncestor(self, root: TreeNode, p: TreeNode, q: TreeNode) -> TreeNode"

