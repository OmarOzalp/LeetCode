hints:
  - "Standing at some node, you can tell which side `p` is on just by comparing values, without searching. What does that tell you about where `p` and `q` are relative to the current node?"
  - If `p` and `q` are both smaller than the current node, they are both in its left subtree, so their LCA is there too. The same goes for both larger and the right subtree.
  - "Walk down from the root. Move left while both values are smaller, and move right while both are larger. The first node where they are not on the same side (one smaller and one larger, or one equal to the node) is the LCA."

approach: Walk down from the root using the BST ordering
optimal_solution: |
  class Solution:
      def lowestCommonAncestor(self, root: TreeNode, p: TreeNode, q: TreeNode) -> TreeNode:
          node = root
          while node:
              if p.val < node.val and q.val < node.val:
                  node = node.left    # both targets live in the left subtree
              elif p.val > node.val and q.val > node.val:
                  node = node.right   # both targets live in the right subtree
              else:
                  return node         # they split here, or one of them IS this node
          return None  # unreachable: p and q are guaranteed to be in the tree

explanation: |
  **Intuition.** In a general binary tree you would have to search for `p` and `q`. In a BST, comparing a value with the current node already tells you which subtree it is in, so you can head straight for the answer.

  Start at the root, which is an ancestor of everything. At each node there are only three possibilities:
  - **Both values are smaller.** `p` and `q` are both in the left subtree. The left child is also a common ancestor and is lower, so go left.
  - **Both values are larger.** By the same argument, go right.
  - **Otherwise they split.** One is smaller and the other larger, or one of them equals the current node. This node is the LCA.

  **Why the split node is the lowest.** It is a common ancestor, because we only ever moved into the subtree containing both targets. Any node strictly below it is in its left subtree or its right subtree, and each of those contains at most one of `p` and `q`. When the current node *is* `p` (or `q`), nothing below it can be an ancestor of `p` itself. So no lower node works.

  **Algorithm.**
  1. Set `node = root`.
  2. While both `p.val` and `q.val` are less than `node.val`, move to `node.left`. While both are greater, move to `node.right`.
  3. As soon as neither holds, return `node`.

  **Subtle points.**
  - Use **strict** comparisons. When `p.val == node.val` the walk must stop, which is how "a node is its own descendant" is handled (Example 2).
  - The order of `p` and `q` doesn't matter. Treat them symmetrically and don't assume `p.val < q.val`.
  - Only values are compared. The tree is never searched, and the walk never backtracks.

key_insight: In a BST the LCA is the first node on the path from the root where p and q stop being on the same side, which is the split point of their value range.

time_complexity: O(h)
space_complexity: O(1)
complexity_explanation: |
  **Time O(h):** each step moves one level down and never backtracks, so the walk visits at most `h + 1` nodes, where `h` is the height of the tree. That is O(log n) for a balanced BST and O(n) for a degenerate one (for example, values inserted in sorted order, which produces a chain).

  **Space O(1):** the iterative walk only keeps a pointer to the current node. A recursive version of the same walk would use O(h) stack space.

data_structures: [Binary search tree]
passes: 1 root-to-LCA walk

alternatives:
  - name: Recursive BST walk
    time_complexity: O(h)
    space_complexity: O(h)
    explanation: |
      The same three-way decision written recursively. If both values are smaller, return the answer from the left subtree. If both are larger, return the answer from the right subtree. Otherwise the current node is the split point.
    tradeoff: Identical logic and time, and some people find it closer to the reasoning. Each step adds a stack frame, though, so it uses O(h) memory instead of O(1). Because the recursive call is the last thing that happens, it converts directly into the loop.
    code: |
      class Solution:
          def lowestCommonAncestor(self, root: TreeNode, p: TreeNode, q: TreeNode) -> TreeNode:
              if p.val < root.val and q.val < root.val:
                  return self.lowestCommonAncestor(root.left, p, q)
              if p.val > root.val and q.val > root.val:
                  return self.lowestCommonAncestor(root.right, p, q)
              return root
  - name: General binary-tree LCA (ignores the BST ordering)
    time_complexity: O(n)
    space_complexity: O(h)
    explanation: |
      A post-order DFS that works on any binary tree. Each call returns `p` or `q` if it finds one of them in its subtree (or the LCA, if it found both), and `None` if it finds neither. A node that receives a non-`None` result from both children is the LCA. A node that *is* `p` or `q` returns itself immediately.
    tradeoff: Worth knowing, since it is the solution to the follow-up problem "LCA of a Binary Tree". Here it throws away the BST ordering, so it may visit every node (O(n)) where the BST walk only follows one path (O(h)).
    code: |
      class Solution:
          def lowestCommonAncestor(self, root: TreeNode, p: TreeNode, q: TreeNode) -> TreeNode:
              if root is None or root is p or root is q:
                  return root
              left = self.lowestCommonAncestor(root.left, p, q)
              right = self.lowestCommonAncestor(root.right, p, q)
              if left and right:      # p and q were found on different sides
                  return root
              return left or right    # pass up whichever side found something

tests:
  - { name: both in the left subtree, input: { root: [6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], p: 3, q: 5 }, expected: 4 }
  - { name: both in the right subtree, input: { root: [6, 2, 8, 0, 4, 7, 9, null, null, 3, 5], p: 7, q: 9 }, expected: 8 }
