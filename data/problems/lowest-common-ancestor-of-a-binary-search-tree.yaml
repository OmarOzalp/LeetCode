  - { name: split at the root with negatives, input: { root: [0, -5, 5, -8, -3, 3, 8], p: -3, q: 3 }, expected: 0 }
  - { name: extreme values, input: { root: [1000000000, -1000000000], p: -1000000000, q: 1000000000 }, expected: 1000000000 }
  - { name: right-skewed chain, input: { root: [1, null, 2, null, 3, null, 4, null, 5], p: 5, q: 3 }, expected: 3 }
  - { name: left-skewed chain, input: { root: [5, 4, null, 3, null, 2, null, 1], p: 1, q: 2 }, expected: 2 }
