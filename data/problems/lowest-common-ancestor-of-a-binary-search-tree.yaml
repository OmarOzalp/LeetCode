benchmark:
  size_label: number of nodes
  sizes: [1000, 5000, 20000, 50000, 100000]
  generator: |
    def generate(n, rng):
        vals = sorted(rng.sample(range(-10**9, 10**9), n))
        # Random BST shape: node i holds vals[i]. Each value range picks a random
        # root (like quicksort pivots), so the expected height is O(log n).
        left, right = [-1] * n, [-1] * n
        root = rng.randrange(n)
        stack = [(root, 0, n)]  # (node, lo, hi): node is the root of vals[lo:hi]
        while stack:
            i, lo, hi = stack.pop()
            if lo < i:
                left[i] = rng.randrange(lo, i)
                stack.append((left[i], lo, i))
            if i + 1 < hi:
                right[i] = rng.randrange(i + 1, hi)
                stack.append((right[i], i + 1, hi))

        # Serialize to LeetCode level order; the last node BFS visits is a deepest one.
        out, queue, last = [], deque([root]), root
        while queue:
            i = queue.popleft()
            if i < 0:
                out.append(None)
                continue
            out.append(vals[i])
            last = i
            queue.append(left[i])
            queue.append(right[i])
        while out[-1] is None:
            out.pop()

        # q = the deepest node's neighbour in sorted order. One of two adjacent
        # values is always an ancestor of the other, so the LCA is deep.
        nb = last - 1 if last > 0 else last + 1
        return {"root": out, "p": vals[last], "q": vals[nb]}
