id: "70"
title: Climbing Stairs
slug: climbing-stairs
leetcode_url: https://leetcode.com/problems/climbing-stairs/
category: dp-1d
difficulty: Easy
patterns: [1-D DP, Fibonacci, Memoization]

description: |
  You are standing at the bottom of a staircase with `n` steps. With each move you climb either **1 step** or **2 steps**.

  Return the number of **distinct sequences of moves** that take you exactly to the top (step `n`).

  Two sequences are different if they differ in at least one move, so `1 + 2` and `2 + 1` count separately.

examples:
  - input: { n: 2 }
    output: 2
    explanation: "Two ways: `1 + 1` or `2`."
  - input: { n: 3 }
    output: 3
    explanation: "Three ways: `1 + 1 + 1`, `1 + 2`, or `2 + 1`."
  - input: { n: 5 }
    output: 8
    explanation: The counts go 1, 2, 3, 5, 8 for n = 1..5. Each count is the sum of the previous two.

constraints:
  - "`1 <= n <= 45`"

function_signature: "def climbStairs(self, n: int) -> int"

starter_code: |
  class Solution:
      def climbStairs(self, n: int) -> int:
          pass

runner:
  kind: function
  method: climbStairs
  params:
    - { name: n, type: int }
  returns: int

hints:
  - Think about the very **last** move of any route to step `n`. What are the only two possibilities for it?
  - If the last move was a 1-step you came from step `n - 1`; if it was a 2-step you came from step `n - 2`. Those two groups of routes never overlap, so how do their counts combine?
  - "`ways(n) = ways(n - 1) + ways(n - 2)` with `ways(1) = 1` and `ways(2) = 2`. Plain recursion recomputes the same values exponentially often; build the answers from the bottom up instead, keeping only the last two."

approach: Bottom-up DP with two variables
optimal_solution: |
  class Solution:
      def climbStairs(self, n: int) -> int:
          if n <= 2:
              return n

          # prev2 = ways to reach step i - 2, prev1 = ways to reach step i - 1
          prev2, prev1 = 1, 2  # steps 1 and 2
          for _ in range(3, n + 1):
              prev2, prev1 = prev1, prev1 + prev2

          return prev1

explanation: |
  **Intuition.** Count routes by how they *end*. Every route to step `i` finishes with either a 1-step (from step `i - 1`) or a 2-step (from step `i - 2`). These two groups are disjoint and together cover every route, so the counts simply add. That is the Fibonacci recurrence in disguise.

  **State & recurrence.**
  - **State:** `dp[i]` = number of distinct ways to reach step `i`.
  - **Transition:** `dp[i] = dp[i - 1] + dp[i - 2]`, because the last move is either 1 or 2 steps.
  - **Base cases:** `dp[1] = 1` (one single step) and `dp[2] = 2` (`1 + 1` or `2`). Equivalently `dp[0] = 1` ("one way to climb nothing: do nothing") and `dp[1] = 1`.
  - **Order:** increasing `i`, since each value depends only on smaller indices.
  - **Space:** `dp[i]` only looks back two entries, so two rolling variables replace the whole table.

  **Algorithm.**
  1. If `n <= 2`, return `n` directly.
  2. Set `prev2 = 1` (step 1) and `prev1 = 2` (step 2).
  3. For each step from 3 to `n`, compute `prev1 + prev2` and shift the window: `prev2, prev1 = prev1, prev1 + prev2`.
  4. Return `prev1`, the count for step `n`.

  **From recursion to DP.** The recursive definition `ways(n) = ways(n - 1) + ways(n - 2)` is correct but recomputes the same subproblems over and over: `ways(n - 2)` is computed once directly and again inside `ways(n - 1)`, and so on, giving about 1.6ⁿ calls. Caching each result (memoization) fixes that; filling the values in increasing order (bottom-up) removes the recursion entirely; noticing that only the last two values matter drops the space to O(1).

  **Edge cases.** `n = 1` must return 1. Python's simultaneous assignment `prev2, prev1 = prev1, prev1 + prev2` updates both variables from the *old* values, so no temporary is needed.

key_insight: The last move is either 1 or 2 steps, so ways(n) = ways(n-1) + ways(n-2) (Fibonacci), and only the previous two values need to be kept.

time_complexity: O(n)
space_complexity: O(1)
complexity_explanation: |
  **Time O(n):** the loop runs `n - 2` times and each iteration does one addition.

  **Space O(1):** only two integers are kept, no matter how large `n` is. (A full `dp` table would be O(n); the recurrence only ever looks two entries back, so the rest of the table is never needed again.)

data_structures: [Two rolling variables]
passes: 1 pass from step 3 to n

alternatives:
  - name: Top-down recursion with memoization
    time_complexity: O(n)
    space_complexity: O(n)
    explanation: |
      Write the recurrence exactly as stated, `ways(i) = ways(i - 1) + ways(i - 2)` with `ways(1) = 1` and `ways(2) = 2`, and cache each result with `@cache`.

      Without the cache this is the naive recursion: the call tree branches twice at every level and repeats the same subproblems, costing about O(1.6ⁿ) calls (`n = 45` would take over a billion calls). With the cache each `ways(i)` is computed once.
    tradeoff: Usually the easiest way to *derive* a DP, since it mirrors the recurrence directly. It costs O(n) memory for the cache plus O(n) recursion depth, while the bottom-up version needs no recursion and only O(1) memory.
    code: |
      class Solution:
          def climbStairs(self, n: int) -> int:
              @cache
              def ways(i: int) -> int:
                  if i <= 2:
                      return i  # ways(1) = 1, ways(2) = 2
                  return ways(i - 1) + ways(i - 2)

              return ways(n)
  - name: Bottom-up DP table
    time_complexity: O(n)
    space_complexity: O(n)
    explanation: |
      Allocate `dp` of size `n + 1`, set `dp[0] = 1` (one way to stand still at the bottom) and `dp[1] = 1`, then fill `dp[i] = dp[i - 1] + dp[i - 2]` for `i = 2..n`. The whole table is visible, which makes the recurrence easy to trace by hand.
    tradeoff: Same O(n) time as the optimal solution and the clearest picture of the DP, but it stores all `n + 1` values even though each step only needs the previous two.
    code: |
      class Solution:
          def climbStairs(self, n: int) -> int:
              dp = [0] * (n + 1)
              dp[0] = 1  # empty climb
              dp[1] = 1
              for i in range(2, n + 1):
                  dp[i] = dp[i - 1] + dp[i - 2]
              return dp[n]

tests:
  - { name: one step, input: { n: 1 }, expected: 1 }
  - { name: four steps, input: { n: 4 }, expected: 5 }
