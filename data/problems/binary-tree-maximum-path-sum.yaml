id: "124"
title: Binary Tree Maximum Path Sum
slug: binary-tree-maximum-path-sum
leetcode_url: https://leetcode.com/problems/binary-tree-maximum-path-sum/
category: trees
difficulty: Hard
patterns: [DFS, Recursion, Postorder Traversal, Tree DP]

description: |
  A **path** in a binary tree is a sequence of nodes where each consecutive pair is joined by an edge, and no node appears more than once. A path has at least one node. It doesn't have to pass through the root, and it can go up through a node and then down into that node's other child.

  The **path sum** is the sum of the values of the nodes on the path.

  Given the `root` of a binary tree, return the **maximum path sum** over all non-empty paths.

examples:
  - input: { root: [1, 2, 3] }
    output: 6
    explanation: "The best path is `2 → 1 → 3`, with sum `2 + 1 + 3 = 6`."
  - input: { root: [-10, 9, 20, null, null, 15, 7] }
    output: 42
    explanation: "The best path is `15 → 20 → 7`, with sum `42`. Extending it through the root `-10` would only lower the sum, so the best path doesn't touch the root at all."
  - input: { root: [-2, -1] }
    output: -1
    explanation: "Every value is negative, but a path must contain at least one node. The best choice is the single node `-1`. The answer is not `0`."

constraints:
  - "The number of nodes in the tree is in the range `[1, 3 * 10^4]`."
  - "`-1000 <= Node.val <= 1000`"

function_signature: "def maxPathSum(self, root: Optional[TreeNode]) -> int"

starter_code: |
  # Definition for a binary tree node.
  # class TreeNode:
