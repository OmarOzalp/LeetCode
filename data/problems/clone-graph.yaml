id: "133"
title: Clone Graph
slug: clone-graph
leetcode_url: https://leetcode.com/problems/clone-graph/
category: graphs
difficulty: Medium
patterns: [DFS, BFS, Hash Map, Graph Traversal]

description: |
  You are given a reference to one node of a **connected, undirected** graph. Return a **deep copy** (clone) of the whole graph.

  Each node has an integer value `val` and a list of its neighbors `neighbors`:

  ```python
  class Node:
      def __init__(self, val=0, neighbors=None):
          self.val = val
          self.neighbors = neighbors if neighbors is not None else []
  ```

  A deep copy uses **brand-new** `Node` objects. The clone must have the same values, the same edges and the same neighbor order as the original, and it must not share a single node with it.

  **Test format:** the graph is written as a 1-indexed adjacency list. Node `i` has value `i`, and entry `i - 1` lists the values of its neighbors. The given node is always node `1`. `[]` means an empty graph (`node` is `None`), and `[[]]` is a single node with no neighbors. Your returned node is converted back to this format and compared, and the checker also verifies that no original node was reused.

examples:
  - input: { node: [[2, 4], [1, 3], [2, 4], [1, 3]] }
    output: [[2, 4], [1, 3], [2, 4], [1, 3]]
    explanation: "A square: 1 is connected to 2 and 4, 2 to 1 and 3, 3 to 2 and 4, and 4 to 1 and 3. The clone has exactly the same shape, made of new nodes."
  - input: { node: [[]] }
    output: [[]]
    explanation: A single node with value 1 and no neighbors.
  - input: { node: [] }
    output: []
    explanation: The graph is empty, so return `None`.

constraints:
  - "The number of nodes in the graph is in the range `[0, 100]`."
  - "`1 <= Node.val <= 100`, and `Node.val` is unique for each node."
  - "There are no repeated edges and no self-loops."
  - "The graph is connected, and every node can be reached from the given node."

function_signature: "def cloneGraph(self, node: Optional['Node']) -> Optional['Node']"

starter_code: |
