id: "226"
title: Invert Binary Tree
slug: invert-binary-tree
leetcode_url: https://leetcode.com/problems/invert-binary-tree/
category: trees
difficulty: Easy
patterns: [DFS, Recursion, BFS]

description: |
  You are given the `root` of a binary tree. **Invert** it, meaning turn it into its mirror image: at every node, the left and right children trade places.

  Return the root of the inverted tree. You may rearrange the existing nodes in place; you don't need to build new ones.

examples:
  - input: { root: [4, 2, 7, 1, 3, 6, 9] }
    output: [4, 7, 2, 9, 6, 3, 1]
    explanation: |
      The root keeps its value, but its subtrees swap sides (`7` is now on the left). The swap happens again inside every subtree, so the bottom row `1 3 6 9` reads `9 6 3 1`.
  - input: { root: [2, 1, 3] }
    output: [2, 3, 1]
  - input: { root: [] }
    output: []
    explanation: An empty tree is its own mirror image, so return `None`.

constraints:
  - "The number of nodes in the tree is in the range `[0, 100]`."
  - "`-100 <= Node.val <= 100`"

function_signature: "def invertTree(self, root: Optional[TreeNode]) -> Optional[TreeNode]"

starter_code: |
