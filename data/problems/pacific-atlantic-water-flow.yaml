benchmark:
  size_label: grid side n (n × n heights)
  sizes: [10, 25, 50, 100, 200]
  generator: |
    def generate(n, rng):
        # A noisy pyramid: height grows with the distance from the nearest edge,
        # so every cell drains to both oceans and both searches cover the whole grid.
        heights = []
        for r in range(n):
            row = []
            for c in range(n):
                ring = min(r, c, n - 1 - r, n - 1 - c)
                row.append(2 * ring + rng.randint(0, 1))
            heights.append(row)
        return {"heights": heights}
