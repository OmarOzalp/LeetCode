hints:
  - Simulating the water from every cell separately repeats a lot of work. Instead of asking "where can this cell's water go?", ask "which cells can send water to this ocean?"
  - Reverse the flow. Start from the cells that touch an ocean and walk **uphill**, moving to a neighbor only if it is at least as high as the current cell. Every cell you reach can drain into that ocean.
  - Run this reverse search twice, from all Pacific border cells at once and from all Atlantic border cells at once (multi-source BFS or DFS). The answer is the set of cells reached by both searches.

approach: Reverse multi-source BFS from each ocean, then intersect
optimal_solution: |
  class Solution:
      def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]:
          rows, cols = len(heights), len(heights[0])

          def can_drain(starts):
              """Every cell whose water can reach the ocean bordering `starts`.
              We walk uphill from the ocean: a neighbor joins if it is at least as high,
              because water could then flow from it down to the current cell."""
              reached = set(starts)
              queue = deque(starts)
              while queue:
                  r, c = queue.popleft()
                  for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                      if (0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in reached
                              and heights[nr][nc] >= heights[r][c]):
                          reached.add((nr, nc))
                          queue.append((nr, nc))
              return reached

          pacific = [(0, c) for c in range(cols)] + [(r, 0) for r in range(1, rows)]
          atlantic = [(rows - 1, c) for c in range(cols)] + [(r, cols - 1) for r in range(rows - 1)]

          both = can_drain(pacific) & can_drain(atlantic)
          return [[r, c] for r, c in both]

explanation: |
  **Intuition.** The direct question, "can water starting here reach both oceans?", needs a separate search for every cell, and those searches overlap heavily. Reverse it: **which cells can drain into the Pacific?** Water flows from a cell to a neighbor that is no higher. So if we stand on a cell that drains into the Pacific, any neighbor that is **at least as high** can also drain into the Pacific by flowing onto our cell. Starting from all Pacific border cells and walking *uphill* finds every Pacific-draining cell in a single traversal. Do the same for the Atlantic, and the answer is the intersection.

  **Algorithm.**
  1. Collect the Pacific border cells (the top row and the left column) and the Atlantic border cells (the bottom row and the right column).
  2. For each ocean, run a **multi-source BFS** that starts with all of its border cells in the queue. From `(r, c)`, move to an unvisited in-bounds neighbor whose height is `>= heights[r][c]`.
  3. The cells visited by both searches are the answer.

  **Subtle points.**
  - The reverse search uses `>=` (uphill or flat). Equal heights let water flow in both directions, so flat areas are fully explored.
  - Corner cells can belong to both oceans: `(0, n-1)` is on the Pacific's top edge and the Atlantic's right edge. A single-row or single-column grid therefore puts every cell in the answer.
  - Each search keeps its own visited set, so every cell is processed at most once per ocean.
  - BFS (or an explicit-stack DFS) avoids deep recursion. A 200 × 200 grid can contain a path through all 40,000 cells.

key_insight: Reverse the flow, walking uphill from each ocean's border with a multi-source search, so two traversals replace one search per cell.

time_complexity: O(m · n)
space_complexity: O(m · n)
complexity_explanation: |
  **Time O(m · n):** each of the two searches adds every cell to its visited set at most once and checks four neighbors per cell. Intersecting the two sets is also O(m · n).

  **Space O(m · n)** for the two visited sets and the BFS queue, which can each hold every cell.

data_structures: [Hash set, Queue, 2D grid]
passes: 2 searches (one per ocean)

alternatives:
  - name: Brute force (search from every cell)
    time_complexity: O((m · n)²)
    space_complexity: O(m · n)
    explanation: |
      For every cell, run a DFS that follows the water *downhill* (to neighbors that are no higher) and records whether it ever touches a Pacific edge and an Atlantic edge. Keep the cell if both happened.
    tradeoff: It follows the problem statement directly and is easy to reason about. But each of the m · n searches can visit every cell again, so a 200 × 200 grid could cost about 1.6 · 10⁹ steps. The reverse search does all of this in two passes.
    code: |
      class Solution:
          def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]:
              rows, cols = len(heights), len(heights[0])
              result = []
              for sr in range(rows):
                  for sc in range(cols):
                      seen = {(sr, sc)}
                      stack = [(sr, sc)]
                      pacific = atlantic = False
                      while stack and not (pacific and atlantic):
                          r, c = stack.pop()
                          if r == 0 or c == 0:
                              pacific = True
                          if r == rows - 1 or c == cols - 1:
                              atlantic = True
                          for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                              if (0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in seen
                                      and heights[nr][nc] <= heights[r][c]):
                                  seen.add((nr, nc))
                                  stack.append((nr, nc))
                      if pacific and atlantic:
                          result.append([sr, sc])
              return result
  - name: Reverse recursive DFS from the borders
    time_complexity: O(m · n)
    space_complexity: O(m · n)
    explanation: |
      The same reverse-flow idea, written as a recursive DFS. Call `dfs(r, c, visited)` from every border cell of an ocean, and recurse into neighbors that are at least as high. Then intersect the two visited sets.
    tradeoff: The same complexity, and many people find it the quickest version to write. On large inputs (for example, a long monotone staircase across a 200 × 200 grid) the recursion can go tens of thousands of calls deep, which exceeds Python's default recursion limit. The BFS has no such risk.
    code: |
      class Solution:
          def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]:
              rows, cols = len(heights), len(heights[0])
              pacific, atlantic = set(), set()

              def dfs(r: int, c: int, visited: set) -> None:
                  visited.add((r, c))
                  for nr, nc in ((r + 1, c), (r - 1, c), (r, c + 1), (r, c - 1)):
                      if (0 <= nr < rows and 0 <= nc < cols and (nr, nc) not in visited
                              and heights[nr][nc] >= heights[r][c]):
                          dfs(nr, nc, visited)

              for c in range(cols):
                  dfs(0, c, pacific)
                  dfs(rows - 1, c, atlantic)
              for r in range(rows):
                  dfs(r, 0, pacific)
                  dfs(r, cols - 1, atlantic)
              return [[r, c] for r, c in pacific & atlantic]

