id: "417"
title: Pacific Atlantic Water Flow
slug: pacific-atlantic-water-flow
leetcode_url: https://leetcode.com/problems/pacific-atlantic-water-flow/
category: graphs
difficulty: Medium
patterns: [Multi-source BFS, DFS, Matrix, Reverse Search]

description: |
  An `m x n` island is described by a matrix `heights`, where `heights[r][c]` is the height of the cell in row `r` and column `c`. The **Pacific Ocean** touches the island's top and left edges, and the **Atlantic Ocean** touches its bottom and right edges.

  Rain water on a cell can flow to any horizontally or vertically adjacent cell whose height is **less than or equal to** the current cell's height. Water on a cell that borders an ocean can flow straight into that ocean.

  Return the coordinates `[r, c]` of every cell from which water can reach **both** oceans. The cells may be returned in any order.

examples:
  - input: { heights: [[1, 2, 3], [8, 9, 4], [7, 6, 5]] }
    output: [[0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]
    explanation: |
      The heights rise in a spiral toward the `9` in the center. Water from `9` can flow down to every edge. `(2, 1)` (height 6) touches the Atlantic directly and reaches the Pacific via `6 → 5 → 4 → 3`. `(0, 0)` and `(0, 1)` touch the Pacific, but every path toward the Atlantic goes uphill, so they are excluded.
  - input: { heights: [[4, 3], [2, 1]] }
    output: [[0, 0], [0, 1], [1, 0]]
    explanation: "`(0, 1)` and `(1, 0)` touch both oceans. `(0, 0)` touches the Pacific and flows down into either of them, so it also reaches the Atlantic. `(1, 1)` touches the Atlantic, but both of its neighbors are higher, so it never reaches the Pacific."
  - input: { heights: [[3, 3, 3], [3, 1, 3], [3, 3, 3]] }
    output: [[0, 0], [0, 1], [0, 2], [1, 0], [1, 2], [2, 0], [2, 1], [2, 2]]
    explanation: Water moves freely along the equal-height border, so every border cell reaches both oceans. The center is a pit and cannot flow anywhere.

constraints:
  - "`m == heights.length`, `n == heights[r].length`"
  - "`1 <= m, n <= 200`"
  - "`0 <= heights[r][c] <= 10^5`"

function_signature: "def pacificAtlantic(self, heights: List[List[int]]) -> List[List[int]]"

