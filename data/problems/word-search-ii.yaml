id: "212"
title: Word Search II
slug: word-search-ii
leetcode_url: https://leetcode.com/problems/word-search-ii/
category: tries
difficulty: Hard
patterns: [Trie, DFS, Backtracking, Matrix]

description: |
  You are given an `m x n` grid of lowercase letters `board` and a list of **distinct** strings `words`. Return every word from `words` that can be traced on the board.

  A word is traced by starting at any cell and repeatedly stepping to a **horizontally or vertically** adjacent cell (no diagonals), reading one letter per cell. Within a single word, each cell may be used **at most once**. Different words may reuse the same cells.

  Return the found words in any order, each one only once (even if it can be traced in several ways).

examples:
  - input:
      board: [["c", "a", "t"], ["r", "e", "d"], ["o", "w", "s"]]
      words: ["cat", "crow", "dew", "tea", "dog", "area"]
    output: ["cat", "crow", "dew"]
    explanation: |
      `"cat"` runs along the top row, `"crow"` goes down the left column and then right, and `"dew"` goes left from `d` to `e` and then down to `w`. `"tea"` fails because `t` (top right) and `e` (center) only touch diagonally.
  - input:
      board: [["a", "b"], ["c", "d"]]
      words: ["abcd", "abdc"]
    output: ["abdc"]
    explanation: "`b` and `c` are diagonal to each other, so `\"abcd\"` cannot be traced, but `a → b → d → c` is a valid path."
  - input:
      board: [["a", "a"]]
      words: ["aaa"]
    output: []
    explanation: The board has only two cells and a cell cannot be used twice in one word.

constraints:
  - "`m == board.length`, `n == board[i].length`"
  - "`1 <= m, n <= 12`"
  - "`board[i][j]` is a lowercase English letter (a one-character string)."
  - "`1 <= words.length <= 3 * 10^4`"
  - "`1 <= words[i].length <= 10`"
  - "`words[i]` consists of lowercase English letters, and all strings in `words` are unique."

function_signature: "def findWords(self, board: List[List[str]], words: List[str]) -> List[str]"

starter_code: |
  class Solution:
      def findWords(self, board: List[List[str]], words: List[str]) -> List[str]:
