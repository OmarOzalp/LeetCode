id: "100"
title: Same Tree
slug: same-tree
leetcode_url: https://leetcode.com/problems/same-tree/
category: trees
difficulty: Easy
patterns: [DFS, Recursion, Simultaneous Traversal]

description: |
  You are given the roots of two binary trees, `p` and `q`. Return `True` if the two trees are **the same**, and `False` otherwise.

  Two trees are the same when they have exactly the same **shape** and every pair of corresponding nodes holds the **same value**. Having the same set of values is not enough: a `2` hanging on the left is different from a `2` hanging on the right.

examples:
  - input: { p: [1, 2, 3], q: [1, 2, 3] }
    output: true
  - input: { p: [1, 2], q: [1, null, 2] }
    output: false
    explanation: Both trees contain the values `1` and `2`, but in `p` the `2` is a left child and in `q` it is a right child. The shapes differ.
  - input: { p: [1, 2, 1], q: [1, 1, 2] }
    output: false
    explanation: The shapes match, but the left children hold different values (`2` vs `1`).

constraints:
  - "The number of nodes in each tree is in the range `[0, 100]`."
  - "`-10^4 <= Node.val <= 10^4`"

function_signature: "def isSameTree(self, p: Optional[TreeNode], q: Optional[TreeNode]) -> bool"

