id: "230"
title: Kth Smallest Element in a BST
slug: kth-smallest-element-in-a-bst
leetcode_url: https://leetcode.com/problems/kth-smallest-element-in-a-bst/
category: trees
difficulty: Medium
patterns: [Inorder Traversal, BST Property, Stack, DFS]

description: |
  You are given the `root` of a **binary search tree** (BST) and an integer `k`. Return the `k`-th smallest value among all nodes in the tree. `k` is **1-indexed**: `k = 1` asks for the minimum.

  In a BST, every value in a node's left subtree is smaller than the node's value, and every value in its right subtree is larger. All values are distinct.

  **Follow-up:** if the tree were modified often (frequent inserts and deletes) and you needed the k-th smallest value after every change, how would you speed this up?

examples:
  - input: { root: [3, 1, 4, null, 2], k: 1 }
    output: 1
    explanation: The values in ascending order are `1, 2, 3, 4`. The 1st smallest is `1`.
  - input: { root: [5, 3, 6, 2, 4, null, null, 1], k: 3 }
    output: 3
    explanation: "In ascending order the values are `1, 2, 3, 4, 5, 6`, so the 3rd smallest is `3`. It is the root of the left subtree, and the two smaller values (`1` and `2`) sit below it on the left."

constraints:
  - "The number of nodes in the tree is `n`."
  - "`1 <= k <= n <= 10^4`"
  - "`0 <= Node.val <= 10^4`"
  - "The tree is a valid BST, so all values are distinct."

function_signature: "def kthSmallest(self, root: Optional[TreeNode], k: int) -> int"

