id: "572"
title: Subtree of Another Tree
slug: subtree-of-another-tree
leetcode_url: https://leetcode.com/problems/subtree-of-another-tree/
category: trees
difficulty: Easy
patterns: [DFS, Recursion, Tree Comparison, String Matching]

description: |
  You are given the roots of two binary trees, `root` and `subRoot`. Return `True` if `root` contains a subtree that is **identical** to `subRoot` (same shape and same values), and `False` otherwise.

  A **subtree** of a tree consists of one of its nodes together with **all** of that node's descendants. Every tree counts as a subtree of itself.

  Matching only the top part of a subtree is not enough. If the candidate node has extra descendants that `subRoot` doesn't have, it is not a match.

examples:
  - input: { root: [3, 4, 5, 1, 2], subRoot: [4, 1, 2] }
    output: true
    explanation: The node `4` in `root`, together with its children `1` and `2`, is exactly `subRoot`.
  - input: { root: [3, 4, 5, 1, 2, null, null, null, null, 0], subRoot: [4, 1, 2] }
    output: false
    explanation: The node `4` starts out looking like a match, but its child `2` has an extra child `0`. The subtree rooted at `4` therefore has four nodes and is not identical to `subRoot`.
  - input: { root: [1, 1], subRoot: [1] }
    output: true
    explanation: The root `1` does not match because it has a child, but the leaf `1` matches. Several nodes can share `subRoot`'s root value, so keep searching after a failed attempt.

constraints:
  - "The number of nodes in `root` is in the range `[1, 2000]`."
  - "The number of nodes in `subRoot` is in the range `[1, 1000]`."
  - "`-10^4 <= root.val, subRoot.val <= 10^4`"

function_signature: "def isSubtree(self, root: Optional[TreeNode], subRoot: Optional[TreeNode]) -> bool"

