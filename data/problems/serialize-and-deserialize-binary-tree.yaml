id: "297"
title: Serialize and Deserialize Binary Tree
slug: serialize-and-deserialize-binary-tree
leetcode_url: https://leetcode.com/problems/serialize-and-deserialize-binary-tree/
category: trees
difficulty: Hard
patterns: [DFS, Preorder Traversal, Recursion, Design, BFS]

description: |
  **Serialization** turns a data structure into a string so it can be saved to a file or sent over a network, and **deserialization** rebuilds the original structure from that string.

  Design a `Codec` class with two methods:
  - `serialize(root)` encodes a binary tree as a single string.
  - `deserialize(data)` decodes such a string back into a tree and returns its root.

  You can choose any format, as long as decoding the encoded string gives back a tree with **exactly the same shape and values** as the original. Values can be negative and can have several digits, and the tree can be empty.

  **How tests work:** the tree is encoded with one `Codec` instance and the string is decoded with a **separate** instance, so you can't keep the tree in `self`. Everything must go through the string. The rebuilt tree is compared with the original (shown here in LeetCode's level-order format), and `serialize` must return a `str`.

examples:
  - input: { root: [1, 2, 3, null, null, 4, 5] }
    output: [1, 2, 3, null, null, 4, 5]
    explanation: "One possible encoding is the preorder string `\"1,2,#,#,3,4,#,#,5,#,#\"`, where `#` marks a missing child. Decoding it must rebuild the same tree."
  - input: { root: [] }
    output: []
    explanation: An empty tree must survive the round trip too, so it needs its own encoding, such as `"#"`.
  - input: { root: [-12, 345, null, 6] }
    output: [-12, 345, null, 6]
    explanation: Negative and multi-digit values are why the encoding needs a separator between values, so that `-12` and `345` can't run together.

constraints:
  - "The number of nodes in the tree is in the range `[0, 10^4]`."
  - "`-1000 <= Node.val <= 1000`"

function_signature: "class Codec: serialize(root) -> str / deserialize(data: str) -> Optional[TreeNode]"

starter_code: |
