id: "143"
title: Reorder List
slug: reorder-list
leetcode_url: https://leetcode.com/problems/reorder-list/
category: linked-list
difficulty: Medium
patterns: [Linked List, Fast/Slow Pointers, In-place Reversal, Merge]

description: |
  You are given the `head` of a singly linked list whose nodes are, in order:

  `L0 -> L1 -> L2 -> ... -> L(n-2) -> L(n-1)`

  Rearrange the nodes so the list alternates between the front and the back:

  `L0 -> L(n-1) -> L1 -> L(n-2) -> L2 -> L(n-3) -> ...`

  Do this **in place** by changing `next` pointers. You may not change the values stored in the nodes. The function returns nothing; the tests read the list starting from the original `head` after your function finishes.

  Lists are shown as arrays of node values: `[1, 2, 3]` means `1 -> 2 -> 3`.

examples:
  - input: { head: [1, 2, 3, 4] }
    output: [1, 4, 2, 3]
    explanation: Take the first node, then the last, then the second, then the second-to-last.
  - input: { head: [1, 2, 3, 4, 5] }
    output: [1, 5, 2, 4, 3]
    explanation: With an odd number of nodes, the middle node (`3`) ends up last.

constraints:
  - "The number of nodes in the list is in the range `[1, 5 * 10^4]`."
  - "`1 <= Node.val <= 1000`"

function_signature: "def reorderList(self, head: Optional[ListNode]) -> None"

