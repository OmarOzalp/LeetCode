hints:
  - Both lists are already sorted, so the smallest remaining value is always at the front of one of them. Which node should come first in the result?
  - Build the result one node at a time by comparing the two current fronts, much like the merge step of merge sort. What should happen when one list runs out?
  - Start the result with a placeholder "dummy" node and keep a `tail` pointer. Repeatedly attach the smaller front node to `tail` and advance in that list. When one list is empty, attach the rest of the other in one step and return `dummy.next`.

approach: Iterative merge with a dummy head
optimal_solution: |
  class Solution:
      def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]:
          dummy = ListNode()  # placeholder before the real head
          tail = dummy        # last node of the merged list so far

          while list1 and list2:
              if list1.val <= list2.val:
                  tail.next = list1
                  list1 = list1.next
              else:
                  tail.next = list2
                  list2 = list2.next
              tail = tail.next

          # At most one list still has nodes, and they are already sorted.
          tail.next = list1 if list1 else list2
          return dummy.next

explanation: |
  **Intuition.** Both lists are sorted, so the smallest node that has not been used yet is always at the **front** of one of the two lists. Taking the smaller front again and again produces the merged list in order. This is exactly the merge step of merge sort, done with pointers instead of array indices.

  **The dummy node trick.** The first node of the result is special: there is no previous node whose `next` we can set. Rather than writing a separate case for it, start with a placeholder `dummy` node. Every real node is then "attached after the current tail", including the first one, and the answer is `dummy.next`.

  **Algorithm.**
  1. Create `dummy` and set `tail = dummy`.
  2. While both lists have nodes, attach the one with the smaller value to `tail.next`, advance that list, and move `tail` forward.
  3. One list is now empty. Attach the remainder of the other list in one step (it is already sorted and already linked).
  4. Return `dummy.next`.

  **Subtle points.**
  - No new nodes are created: we only re-link existing ones, so the extra memory is O(1).
  - Using `<=` takes from `list1` on ties. Either choice gives a correct sorted list; `<=` keeps the merge *stable* (equal values keep their original list order), which matters when merge sort is used on records.
  - Empty inputs need no special case: the loop is skipped and `tail.next` becomes whichever list is non-empty (or `None`).

key_insight: The smallest unused node is always at the front of one of the two sorted lists, so repeatedly splicing the smaller front after a dummy head builds the merged list in one pass.

time_complexity: O(m + n)
space_complexity: O(1)
complexity_explanation: |
  **Time O(m + n)** for lists of lengths m and n: every loop iteration attaches exactly one node, so there are at most m + n iterations, and the leftover tail is attached in O(1).

  **Space O(1):** we only allocate the single dummy node and a few pointers. The merged list reuses the input nodes.

data_structures: [Linked list]
passes: 1 pass over both lists

alternatives:
  - name: Collect all nodes, sort, relink
    time_complexity: O((m + n) log(m + n))
    space_complexity: O(m + n)
    explanation: |
      Put every node from both lists into one Python list, sort it by value, and relink the nodes in that order. It works for any number of unsorted lists.
    tradeoff: Simple, but it throws away the fact that the inputs are already sorted, so it pays for a full sort and O(m + n) extra memory. The two-pointer merge is linear and uses O(1) extra memory.
    code: |
      class Solution:
          def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]:
              nodes = []
              for node in (list1, list2):
                  while node:
                      nodes.append(node)
                      node = node.next
              nodes.sort(key=lambda node: node.val)

              dummy = tail = ListNode()
              for node in nodes:
                  tail.next = node
                  tail = node
              tail.next = None  # the last node must not keep its old successor
              return dummy.next
  - name: Recursive merge
    time_complexity: O(m + n)
    space_complexity: O(m + n)
    explanation: |
      The merged list starts with the smaller of the two heads; everything after it is the merge of the remaining nodes. So pick the smaller head, set its `next` to the recursive merge of the rest, and return it. If either list is empty, return the other.
    tradeoff: Very short and a nice example of recursive thinking on lists, but it uses one stack frame per node (O(m + n) memory) and can hit the recursion limit on long lists. The iterative version uses O(1) memory.
    code: |
      class Solution:
          def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]:
              if list1 is None:
                  return list2
              if list2 is None:
                  return list1
              if list1.val <= list2.val:
                  list1.next = self.mergeTwoLists(list1.next, list2)
                  return list1
              list2.next = self.mergeTwoLists(list1, list2.next)
              return list2

tests:
  - { name: second list empty, input: { list1: [1, 2, 3], list2: [] }, expected: [1, 2, 3] }
  - { name: first list entirely smaller, input: { list1: [1, 2, 3], list2: [4, 5, 6] }, expected: [1, 2, 3, 4, 5, 6] }
  - { name: perfectly interleaved, input: { list1: [1, 3, 5, 7], list2: [2, 4, 6, 8] }, expected: [1, 2, 3, 4, 5, 6, 7, 8] }
  - { name: all values equal, input: { list1: [2, 2, 2], list2: [2, 2] }, expected: [2, 2, 2, 2, 2] }
  - { name: negative values, input: { list1: [-100, -5, 0], list2: [-10, 50, 100] }, expected: [-100, -10, -5, 0, 50, 100] }
  - { name: very different lengths, input: { list1: [5], list2: [1, 2, 3, 4, 6, 7] }, expected: [1, 2, 3, 4, 5, 6, 7] }
  - { name: single nodes out of order, input: { list1: [2], list2: [1] }, expected: [1, 2] }

benchmark:
  size_label: nodes per list
  sizes: [2, 10, 25, 50]
  generator: |
    def generate(n, rng):
        # Two sorted lists of n values each (the constraints allow at most 50 per
        # list). Random values in [-100, 100] interleave and include duplicates.
        a = sorted(rng.randint(-100, 100) for _ in range(n))
        b = sorted(rng.randint(-100, 100) for _ in range(n))
        return {"list1": a, "list2": b}
