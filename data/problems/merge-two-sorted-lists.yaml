id: "21"
title: Merge Two Sorted Lists
slug: merge-two-sorted-lists
leetcode_url: https://leetcode.com/problems/merge-two-sorted-lists/
category: linked-list
difficulty: Easy
patterns: [Linked List, Two Pointers, Dummy Node]

description: |
  You are given the heads of two linked lists, `list1` and `list2`, each sorted in **non-decreasing** order.

  Merge them into a single sorted linked list by **splicing together** the existing nodes (re-linking their `next` pointers rather than creating new nodes), and return the head of the merged list.

  The tests show linked lists as arrays of node values: `[1, 2, 4]` means `1 -> 2 -> 4`, and `[]` means an empty list (`None`).

examples:
  - input: { list1: [1, 2, 4], list2: [1, 3, 4] }
    output: [1, 1, 2, 3, 4, 4]
    explanation: Repeatedly take the smaller of the two front nodes. Equal values (`1` and `1`, `4` and `4`) can be taken in either order.
  - input: { list1: [], list2: [] }
    output: []
  - input: { list1: [], list2: [0] }
    output: [0]
    explanation: If one list is empty, the answer is simply the other list.

constraints:
  - "The number of nodes in both lists is in the range `[0, 50]`."
  - "`-100 <= Node.val <= 100`"
  - Both `list1` and `list2` are sorted in **non-decreasing** order.

function_signature: "def mergeTwoLists(self, list1: Optional[ListNode], list2: Optional[ListNode]) -> Optional[ListNode]"

starter_code: |
