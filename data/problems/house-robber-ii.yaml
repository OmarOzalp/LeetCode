  - { name: single empty house, input: { nums: [0] }, expected: 0 }
  - { name: two houses are neighbors, input: { nums: [1, 2] }, expected: 2 }
  - { name: three equal houses, input: { nums: [1, 1, 1] }, expected: 1 }
  - { name: all empty, input: { nums: [0, 0, 0, 0] }, expected: 0 }
  - { name: rich first house, input: { nums: [200, 3, 140, 20, 10] }, expected: 340 }
  - { name: rich last house, input: { nums: [1, 3, 1, 3, 100] }, expected: 103 }
  - { name: skip two in a row, input: { nums: [4, 1, 2, 7, 5, 3, 1] }, expected: 14 }
