id: "139"
title: Word Break
slug: word-break
leetcode_url: https://leetcode.com/problems/word-break/
category: dp-1d
difficulty: Medium
patterns: [1-D DP, Memoization, Hash Set]

description: |
  You are given a string `s` and a list of dictionary words `wordDict`. Return `True` if `s` can be cut into a sequence of **one or more dictionary words** with nothing left over, and `False` otherwise.

  A dictionary word may be **used any number of times**, and not every word has to be used.

examples:
  - input: { s: leetcode, wordDict: [leet, code] }
    output: true
    explanation: "`\"leetcode\"` = `\"leet\"` + `\"code\"`."
  - input: { s: applepenapple, wordDict: [apple, pen] }
    output: true
    explanation: "`\"apple\"` + `\"pen\"` + `\"apple\"`. Reusing `\"apple\"` is allowed."
  - input: { s: catsandog, wordDict: [cats, dog, sand, and, cat] }
    output: false
    explanation: "`\"cats\"` + `\"and\"` leaves `\"og\"`, and `\"cat\"` + `\"sand\"` also leaves `\"og\"`. No split covers the whole string."

constraints:
  - "`1 <= s.length <= 300`"
  - "`1 <= wordDict.length <= 1000`"
  - "`1 <= wordDict[i].length <= 20`"
  - "`s` and every `wordDict[i]` consist of lowercase English letters."
  - All the words in `wordDict` are distinct.

function_signature: "def wordBreak(self, s: str, wordDict: List[str]) -> bool"

starter_code: |
  class Solution:
      def wordBreak(self, s: str, wordDict: List[str]) -> bool:
          pass

runner:
  kind: function
  method: wordBreak
  params:
    - { name: s, type: str }
    - { name: wordDict, type: "List[str]" }
  returns: bool

hints:
  - Greedily taking the longest (or shortest) matching word fails. Try `s = "cars"` with `["car", "ca", "rs"]`. What smaller question would tell you whether a split is possible?
  - If the **last** word of a valid split is `s[j:i]`, then the prefix `s[:j]` must itself be splittable. The question "can this prefix be split?" only depends on where the prefix ends.
  - "Let `dp[i]` mean \"`s[:i]` can be split\", with `dp[0] = True`. Then `dp[i]` is true if some `j` has `dp[j]` true and `s[j:i]` in the word set. Words are at most 20 characters long, so only a few `j` values per `i` need checking."

approach: Bottom-up DP over prefixes with a word set
optimal_solution: |
  class Solution:
      def wordBreak(self, s: str, wordDict: List[str]) -> bool:
          words = set(wordDict)                     # O(1) average membership checks
          lengths = sorted({len(w) for w in words})  # distinct word lengths (at most 20)
          n = len(s)

          # dp[i] is True when the prefix s[:i] can be split into dictionary words.
          dp = [False] * (n + 1)
          dp[0] = True  # the empty prefix needs no words

          for i in range(1, n + 1):
              for length in lengths:
                  if length > i:
                      break  # lengths are sorted; longer words cannot fit either
                  # Try s[i - length:i] as the LAST word; what precedes it must be splittable.
                  if dp[i - length] and s[i - length:i] in words:
                      dp[i] = True
                      break

          return dp[n]

explanation: |
  **Intuition.** Picking words greedily goes wrong because an early choice can strand the rest of the string (`"cars"`: taking `"car"` leaves `"s"`, but `"ca"` + `"rs"` works). Instead, ask a question about **prefixes**: "can `s[:i]` be split?" A prefix can be split exactly when it ends with some dictionary word *and* the part before that word can be split. Every one of those smaller questions is again about a prefix, so the answers can be built from left to right.

  **State & recurrence.**
  - **State:** `dp[i]` = `True` if the first `i` characters `s[:i]` can be segmented into dictionary words.
  - **Transition:** `dp[i] = any(dp[j] and s[j:i] in words)` over split points `j < i`. Here `s[j:i]` is the candidate last word.
  - **Base case:** `dp[0] = True`. The empty prefix is trivially segmented, which lets the first word be checked with the same rule.
  - **Order:** `i` increasing, since `dp[i]` only reads `dp[j]` for `j < i`.
  - **Pruning:** the last word has to be a dictionary word, so `i - j` must be one of the dictionary's word lengths. Trying only those (at most 20 distinct lengths) instead of all `j` turns an O(n²) scan per string into O(n · L).

  **Algorithm.**
  1. Put the words in a set and collect the distinct word lengths, sorted.
  2. Set `dp[0] = True` and all other entries to `False`.
  3. For each `i` from 1 to `n`, for each word length `length <= i`, check whether `dp[i - length]` holds and `s[i - length:i]` is a word. If so, set `dp[i] = True` and stop early.
  4. Return `dp[n]`.

  **Why plain backtracking is too slow.** Trying every split recursively explores the same suffixes again and again. For `s = "aaaa…ab"` with words `"a"`, `"aa"`, `"aaa"`, … there are exponentially many ways to split the `a`s, and every one fails at the final `b`. The DP decides each prefix exactly once, so the trap costs nothing.

  **Subtle points.** Convert `wordDict` to a set, because list membership would add a factor of `m`. Checking `dp[i - length]` before slicing skips the string work for prefixes that are already known to be unsplittable.

key_insight: "dp[i] = some dictionary word ends at i and the prefix before it is splittable; deciding each prefix once (with dp[0] = True) replaces exponential backtracking with O(n · L) checks."

time_complexity: O(n · L² + m · L)
space_complexity: O(n + m · L)
complexity_explanation: |
  Let `n = len(s)`, `m` the number of words and `L <= 20` the maximum word length.

  **Time O(n · L² + m · L):** building the set hashes every word (O(m · L)). Then each of the `n` positions tries at most `L` distinct lengths, and each try slices and hashes a substring of length at most `L`.

  **Space O(n + m · L):** the `dp` array has `n + 1` booleans and the word set stores all dictionary characters.

data_structures: [Hash set, Array (DP table)]
passes: 1 pass over s, trying each word length

alternatives:
  - name: Top-down recursion with memoization
    time_complexity: O(n · L² + m · L)
    space_complexity: O(n + m · L)
    explanation: |
      `can_split(start)` answers "can the suffix `s[start:]` be segmented?". It tries every dictionary word that begins at `start` (prefixes up to the longest word length) and recurses on the remainder. `can_split(n)` is `True`.

      This is the natural backtracking solution, and without `@lru_cache(None)` it is exponential on inputs like `"aaaa…ab"`. With the cache each `start` is resolved once, giving the same bounds as the bottom-up DP.
    tradeoff: Often the quickest to write correctly from the "try a first word, then solve the rest" idea, and it only explores reachable positions. It uses recursion (depth up to `n = 300`) and a cache. The bottom-up loop is just as fast and has no recursion.
    code: |
      class Solution:
          def wordBreak(self, s: str, wordDict: List[str]) -> bool:
              words = set(wordDict)
              max_len = max(len(w) for w in words)
              n = len(s)

              @lru_cache(None)
              def can_split(start: int) -> bool:
                  """Can the suffix s[start:] be split into dictionary words?"""
                  if start == n:
                      return True
                  for end in range(start + 1, min(n, start + max_len) + 1):
                      if s[start:end] in words and can_split(end):
                          return True
                  return False

              return can_split(0)
  - name: Bottom-up DP trying every split point
    time_complexity: O(n³ + m · L)
    space_complexity: O(n + m · L)
    explanation: |
      The textbook version of the same recurrence: for every `i`, try every earlier split point `j` from 0 to `i - 1` and check `dp[j] and s[j:i] in words`. It is the most common first answer in interviews.
    tradeoff: Same DP and easy to explain, but it ignores that dictionary words are short. There are about n²/2 pairs `(j, i)` (45,000 at n = 300) and each check slices up to `n` characters, roughly 4.5 million character operations in total. Restricting `i - j` to actual word lengths cuts that to at most 20 per position.
    code: |
      class Solution:
          def wordBreak(self, s: str, wordDict: List[str]) -> bool:
              words = set(wordDict)
              n = len(s)
              dp = [False] * (n + 1)  # dp[i]: can s[:i] be split?
              dp[0] = True
              for i in range(1, n + 1):
                  for j in range(i):
                      if dp[j] and s[j:i] in words:
                          dp[i] = True
                          break
              return dp[n]

tests:
  - { name: single letter word, input: { s: a, wordDict: [a] }, expected: true }
  - { name: missing letter, input: { s: a, wordDict: [b] }, expected: false }
  - { name: word longer than s, input: { s: ab, wordDict: [abc, b] }, expected: false }
  - { name: greedy longest match fails, input: { s: cars, wordDict: [car, ca, rs] }, expected: true }
  - { name: mixed word lengths, input: { s: aaaaaaa, wordDict: [aaaa, aaa] }, expected: true }
  - { name: only even lengths, input: { s: aaaaaaa, wordDict: [aaaa, aa] }, expected: false }
  - { name: several valid splits, input: { s: catsanddog, wordDict: [cat, cats, and, sand, dog] }, expected: true }
  - { name: overlapping prefixes, input: { s: goalspecial, wordDict: [go, goal, goals, special] }, expected: true }
  - name: backtracking trap
    input:
      s: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaab
      wordDict: [a, aa, aaa, aaaa, aaaaa, aaaaaa, aaaaaaa, aaaaaaaa, aaaaaaaaa, aaaaaaaaaa]
    expected: false

benchmark:
  size_label: length of s
  sizes: [25, 50, 100, 200, 300]
  generator: |
    def generate(n, rng):
        # s is glued together from dictionary words, so prefixes can be split in
        # many ways (the runs of 'a' alone allow exponentially many), and then ends
        # in a 'c' that no word contains. The answer is False, but only after every
        # split has been ruled out: the classic trap for un-memoized backtracking.
        words = ["a" * k for k in range(1, 11)]
        while len(words) < 60:
            w = "".join(rng.choice("aab") for _ in range(rng.randint(2, 12)))
            if w not in words:
                words.append(w)
        rng.shuffle(words)
        s = ""
        while len(s) < n - 1:
            s += rng.choice(words)
        return {"s": s[:n - 1] + "c", "wordDict": words}
