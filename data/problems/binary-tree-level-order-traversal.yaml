id: "102"
title: Binary Tree Level Order Traversal
slug: binary-tree-level-order-traversal
leetcode_url: https://leetcode.com/problems/binary-tree-level-order-traversal/
category: trees
difficulty: Medium
patterns: [BFS, Queue, Level-by-Level Processing]

description: |
  Given the `root` of a binary tree, return the values of its nodes **level by level**: first the root, then all nodes one edge below it, then all nodes two edges below, and so on.

  Return a list of lists, where the `i`-th inner list holds the values on level `i`, ordered **left to right**. An empty tree produces an empty list.

examples:
  - input: { root: [3, 9, 20, null, null, 15, 7] }
    output: [[3], [9, 20], [15, 7]]
    explanation: Level 0 is just the root `3`, level 1 holds its children `9` and `20`, and level 2 holds `20`'s children `15` and `7`.
  - input: { root: [1] }
    output: [[1]]
  - input: { root: [] }
    output: []

constraints:
  - "The number of nodes in the tree is in the range `[0, 2000]`."
  - "`-1000 <= Node.val <= 1000`"

function_signature: "def levelOrder(self, root: Optional[TreeNode]) -> List[List[int]]"

starter_code: |
