  - { name: same start times, input: { intervals: [[4, 9], [4, 17], [9, 10]] }, expected: 2 }
  - { name: two separate busy periods, input: { intervals: [[1, 3], [2, 4], [3, 5], [10, 12], [10, 13], [11, 14]] }, expected: 3 }
  - { name: early meeting ends before the peak, input: { intervals: [[1, 8], [6, 20], [9, 16], [13, 17]] }, expected: 3 }
  - { name: boundary times, input: { intervals: [[0, 1000000], [0, 1], [999999, 1000000]] }, expected: 2 }

benchmark:
  size_label: number of meetings
  sizes: [100, 500, 2000, 10000]
  generator: |
    def generate(n, rng):
        # Random meetings over a day of 10^6 time units, lasting up to 5 * 10^4
        # units each, so at the largest size a few hundred overlap at once.
        intervals = []
        for _ in range(n):
            start = rng.randint(0, 999999)
            end = min(1000000, start + rng.randint(1, 50000))
            intervals.append([start, end])
        return {"intervals": intervals}
