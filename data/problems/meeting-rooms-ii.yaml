  - { name: touching meetings share a room, input: { intervals: [[1, 5], [5, 10]] }, expected: 1 }
  - { name: identical meetings, input: { intervals: [[1, 2], [1, 2], [1, 2]] }, expected: 3 }
  - { name: fully nested meetings, input: { intervals: [[1, 10], [2, 9], [3, 8], [4, 7]] }, expected: 4 }
  - { name: back-to-back meetings unsorted, input: { intervals: [[3, 4], [0, 1], [2, 3], [1, 2]] }, expected: 1 }
