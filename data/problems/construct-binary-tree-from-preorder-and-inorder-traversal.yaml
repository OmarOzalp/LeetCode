id: "105"
title: Construct Binary Tree from Preorder and Inorder Traversal
slug: construct-binary-tree-from-preorder-and-inorder-traversal
leetcode_url: https://leetcode.com/problems/construct-binary-tree-from-preorder-and-inorder-traversal/
category: trees
difficulty: Medium
patterns: [Divide and Conquer, Recursion, Hash Map, DFS]

description: |
  You are given two integer arrays that describe the same binary tree:
  - `preorder`: the values in **preorder** (node, then left subtree, then right subtree).
  - `inorder`: the values in **inorder** (left subtree, then node, then right subtree).

  Rebuild the tree and return its root.

  All values are **distinct**. That matters, because it lets you find any value's position in `inorder` without ambiguity.

examples:
  - input: { preorder: [3, 9, 20, 15, 7], inorder: [9, 3, 15, 20, 7] }
    output: [3, 9, 20, null, null, 15, 7]
    explanation: "`preorder[0] = 3` is the root. In `inorder`, `3` sits at index 1, so `[9]` (left of it) forms the left subtree and `[15, 20, 7]` (right of it) forms the right subtree. Repeat on each side: the next preorder value, `9`, is the left subtree's root, and `20` is the right subtree's root."
  - input: { preorder: [-1], inorder: [-1] }
    output: [-1]
  - input: { preorder: [1, 2, 3], inorder: [3, 2, 1] }
    output: [1, 2, null, 3]
    explanation: Every root appears at the far right of its inorder range, so every node has only a left child. The result is a left-leaning chain.

constraints:
  - "`1 <= preorder.length <= 3000`"
  - "`inorder.length == preorder.length`"
  - "`-3000 <= preorder[i], inorder[i] <= 3000`"
  - "`preorder` and `inorder` consist of **unique** values."
  - "Every value of `inorder` also appears in `preorder`."
  - "`preorder` and `inorder` are guaranteed to be the preorder and inorder traversals of the same tree."

function_signature: "def buildTree(self, preorder: List[int], inorder: List[int]) -> Optional[TreeNode]"

