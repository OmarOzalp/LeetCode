id: "104"
title: Maximum Depth of Binary Tree
slug: maximum-depth-of-binary-tree
leetcode_url: https://leetcode.com/problems/maximum-depth-of-binary-tree/
category: trees
difficulty: Easy
patterns: [DFS, Recursion, BFS]

description: |
  Given the `root` of a binary tree, return its **maximum depth**.

  The maximum depth is the number of nodes on the longest path that starts at the root and goes down to a leaf (a node with no children). Depth counts **nodes**, not edges, so a tree with a single node has depth `1` and an empty tree has depth `0`.

examples:
  - input: { root: [3, 9, 20, null, null, 15, 7] }
    output: 3
    explanation: "The longest root-to-leaf paths are `3 → 20 → 15` and `3 → 20 → 7`, each containing 3 nodes. The path `3 → 9` is shorter."
  - input: { root: [1, null, 2] }
    output: 2
  - input: { root: [1, 2, 3, 4, null, null, null, 5] }
    output: 4
    explanation: "The deepest leaf is `5`, reached by `1 → 2 → 4 → 5`. The leaf `3` is only at depth 2, so a tree can be much deeper on one side than the other."

constraints:
  - "The number of nodes in the tree is in the range `[0, 10^4]`."
  - "`-100 <= Node.val <= 100`"

function_signature: "def maxDepth(self, root: Optional[TreeNode]) -> int"

starter_code: |
