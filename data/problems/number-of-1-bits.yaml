id: "191"
title: Number of 1 Bits
slug: number-of-1-bits
leetcode_url: https://leetcode.com/problems/number-of-1-bits/
category: bit-manipulation
difficulty: Easy
patterns: [Bit Manipulation, Brian Kernighan's Trick]

description: |
  Given a non-negative integer `n` that fits in 32 bits, return how many of its bits are `1` in binary. This count is also called the **Hamming weight** or **population count** of `n`.

  For example, `11` is `1011` in binary, which has three `1` bits.

  **Follow-up:** can you make the loop run once per `1` bit rather than once per bit position?

examples:
  - input: { n: 11 }
    output: 3
    explanation: "`11` is `1011` in binary: three `1` bits."
  - input: { n: 128 }
    output: 1
    explanation: "`128` is `10000000`, a power of two, which always has exactly one `1` bit."
  - input: { n: 2147483645 }
    output: 30
    explanation: "`2147483645` is `1111111111111111111111111111101` (31 bits), and only one of them is `0`."

constraints:
  - "`0 <= n <= 2^32 - 1`"

function_signature: "def hammingWeight(self, n: int) -> int"

starter_code: |
  class Solution:
      def hammingWeight(self, n: int) -> int:
          pass

runner:
  kind: function
  method: hammingWeight
  params:
    - { name: n, type: int }
  returns: int

hints:
  - The simplest approach looks at the bits one at a time. How do you read the lowest bit of `n`, and how do you move the next bit into that spot?
  - That takes 32 steps no matter what. Try to jump straight from one `1` bit to the next. Write a number and the number one less than it in binary, one above the other. Which bits change?
  - Subtracting 1 turns the lowest `1` bit into `0` and every `0` below it into `1`, and leaves the higher bits alone. So `n & (n - 1)` is `n` with its lowest `1` bit cleared. Count how many times you can do that before `n` becomes 0.

approach: Clear the lowest set bit (n & (n - 1))
optimal_solution: |
  class Solution:
      def hammingWeight(self, n: int) -> int:
          count = 0
          while n:
              n &= n - 1  # clear the lowest 1 bit
              count += 1
          return count

explanation: |
  **Intuition.** Look at what subtracting 1 does in binary. The lowest `1` bit becomes `0`, every `0` below it becomes `1` (a borrow, like `1000 - 1 = 0999` in decimal), and the bits above it stay the same. AND-ing with the original keeps the unchanged upper bits and wipes everything from the lowest `1` down:

  ```
  n           = 1011 1000   (184)
  n - 1       = 1011 0111   (183)
  n & (n - 1) = 1011 0000   (176)   <- the lowest 1 is gone, the rest is the same
  ```

  So each `n &= n - 1` removes exactly one `1` bit. Count how many times you can do it before `n` reaches `0`.

  Trace for `n = 11`:

  ```
  n = 1011   n - 1 = 1010   n & (n - 1) = 1010   count = 1
  n = 1010   n - 1 = 1001   n & (n - 1) = 1000   count = 2
  n = 1000   n - 1 = 0111   n & (n - 1) = 0000   count = 3   -> stop
  ```

  **Algorithm.**
  1. Start with `count = 0`.
  2. While `n != 0`: set `n = n & (n - 1)` and add 1 to `count`.
  3. Return `count`.

  **Subtle points.**
  - The loop runs once per `1` bit, not once per bit position. For `n = 2^31` it stops after 1 step, while checking every bit always takes 32.
  - This works because `n` is non-negative. In Python a negative integer acts as if it had infinitely many leading `1` bits, so the loop would never end. With negative input you would first mask it to 32 bits with `n & 0xFFFFFFFF`. This issue comes back in *Reverse Bits* and *Sum of Two Integers*.
  - The same trick tests for a power of two: `n > 0 and n & (n - 1) == 0`, because powers of two have exactly one `1` bit.
  - In real Python code, `n.bit_count()` (3.10+) or `bin(n).count("1")` does this in C. Interviewers want to see the bit reasoning.

key_insight: n & (n - 1) clears exactly the lowest 1 bit, so the loop runs once per 1 bit instead of once per bit position.

time_complexity: O(1)
space_complexity: O(1)
complexity_explanation: |
  **Time O(1):** more precisely the loop runs `k` times, where `k` is the number of `1` bits, because each iteration removes one of them. Since `n` has at most 32 bits, `k <= 32`, so the work is bounded by a constant. The improvement over checking every bit is in the constant: a number with few `1` bits finishes in a few steps instead of always 32. For a general word size `b` it is O(k) versus O(b).

  **Space O(1):** one counter, and `n` is updated in place.

data_structures: [Integer bits]
passes: One iteration per 1 bit

alternatives:
  - name: Check every bit position
    time_complexity: O(1)
    space_complexity: O(1)
    explanation: |
      For each of the 32 positions `i`, shift `n` right by `i` and look at the lowest bit with `& 1`. Add it to the count.

      ```
      n = 1011:  i=0 -> 1,  i=1 -> 1,  i=2 -> 0,  i=3 -> 1   (count 3)
      ```
    tradeoff: The most natural first answer and also O(1) for a 32-bit input, but it always does exactly 32 iterations, even for `n = 0` or a single `1` bit. The `n & (n - 1)` loop skips the zeros and does only as many iterations as there are `1` bits.
    code: |
      class Solution:
          def hammingWeight(self, n: int) -> int:
              count = 0
              for i in range(32):
                  count += (n >> i) & 1  # the bit at position i
              return count

tests:
  - { name: zero, input: { n: 0 }, expected: 0 }
  - { name: one, input: { n: 1 }, expected: 1 }
  - { name: highest bit only (2^31), input: { n: 2147483648 }, expected: 1 }
  - { name: all 32 bits set, input: { n: 4294967295 }, expected: 32 }
  - { name: 2^31 - 1, input: { n: 2147483647 }, expected: 31 }
  - { name: 2^10 - 1, input: { n: 1023 }, expected: 10 }
  - { name: alternating 1010... (0xAAAAAAAA), input: { n: 2863311530 }, expected: 16 }
  - { name: alternating 0101... (0x55555555), input: { n: 1431655765 }, expected: 16 }
  - { name: all ones except bit 1 (0xFFFFFFFD), input: { n: 4294967293 }, expected: 31 }
