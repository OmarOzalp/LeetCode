id: "19"
title: Remove Nth Node From End of List
slug: remove-nth-node-from-end-of-list
leetcode_url: https://leetcode.com/problems/remove-nth-node-from-end-of-list/
category: linked-list
difficulty: Medium
patterns: [Linked List, Two Pointers, Dummy Node]

description: |
  Given the `head` of a linked list and an integer `n`, remove the `n`-th node **counting from the end** of the list (`n = 1` is the last node) and return the head of the resulting list.

  Lists are shown as arrays of node values: `[1, 2, 3]` means `1 -> 2 -> 3`, and `[]` means an empty list (`None`).

  **Follow-up:** can you do it in a single pass?

examples:
  - input: { head: [1, 2, 3, 4, 5], n: 2 }
    output: [1, 2, 3, 5]
    explanation: The 2nd node from the end is `4`. Unlinking it connects `3` directly to `5`.
  - input: { head: [1], n: 1 }
    output: []
    explanation: Removing the only node leaves an empty list.
  - input: { head: [1, 2], n: 1 }
    output: [1]

constraints:
  - "The number of nodes in the list is `sz`."
  - "`1 <= sz <= 30`"
  - "`0 <= Node.val <= 100`"
  - "`1 <= n <= sz`"

function_signature: "def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]"

starter_code: |
