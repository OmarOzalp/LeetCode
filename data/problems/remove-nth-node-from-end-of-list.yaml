    - { name: n, type: int }
  returns: "Optional[ListNode]"

hints:
  - To unlink a node from a singly linked list you need a pointer to the node **before** it. If you knew the length of the list, which node from the front would that be?
  - Counting the length first takes two passes. For one pass, think about two pointers that walk the list together but stay a fixed distance apart.
  - Put a dummy node in front of the head so that removing the head is not a special case. Move a leading pointer `n + 1` steps ahead of a trailing pointer that starts at the dummy, then advance both until the leader falls off the end. The trailer is now right before the node to remove.

approach: Two pointers with a gap of n (one pass)
optimal_solution: |
  class Solution:
      def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:
          dummy = ListNode(0, head)  # lets us remove the real head like any other node
          lead = trail = dummy

          # Put lead n + 1 nodes ahead of trail.
          for _ in range(n + 1):
              lead = lead.next

          # Move both until lead runs off the end; trail stops just before the target.
          while lead:
              lead = lead.next
              trail = trail.next

          trail.next = trail.next.next  # unlink the n-th node from the end
          return dummy.next

explanation: |
  **Intuition.** Removing a node from a singly linked list means changing the `next` pointer of the node **before** it. The hard part is finding that node when the position is given from the end.

  Imagine two pointers walking the list together with exactly `n + 1` steps between them. When the leading pointer falls off the end (becomes `None`), the trailing pointer is `n + 1` nodes behind the end, which is exactly the node just before the `n`-th node from the end.

  **The dummy node.** If `n` equals the length of the list, the node to remove is the head, which has no predecessor. Putting a dummy node in front gives every real node, including the head, a predecessor, so one code path handles all cases. Return `dummy.next`, not `head`, since the head may have been removed.

  **Algorithm.**
  1. Create `dummy` with `dummy.next = head`; set `lead = trail = dummy`.
  2. Advance `lead` by `n + 1` steps.
  3. Advance both pointers until `lead` is `None`.
  4. Set `trail.next = trail.next.next` and return `dummy.next`.

  **Example.** `head = [1, 2, 3, 4, 5], n = 2`: `lead` starts 3 steps ahead, at `3`. Moving both three more times leaves `lead = None` and `trail` at `3`, whose next node `4` is removed.

  **Subtle points.**
  - The gap must be `n + 1`, not `n`, so `trail` stops *before* the target instead of on it.
  - Advancing `lead` `n + 1` times is always safe: the list has at least `n` real nodes plus the dummy, so `lead` becomes `None` at worst on the last step.

key_insight: Two pointers kept n + 1 nodes apart turn "n-th from the end" into a single pass, and a dummy head makes deleting the first node no different from any other.

time_complexity: O(sz)
space_complexity: O(1)
complexity_explanation: |
  **Time O(sz):** the leading pointer walks the whole list exactly once (n + 1 steps, then the rest), and the trailing pointer walks part of it alongside. Every step is O(1).

  **Space O(1):** one dummy node and two pointers, regardless of the length of the list.

data_structures: [Linked list]
passes: 1 pass over the list

alternatives:
  - name: Two passes (count the length first)
    time_complexity: O(sz)
    space_complexity: O(1)
    explanation: |
      First walk the list to count its length `L`. The node to remove is then at index `L - n` from the front (0-based), so walk `L - n` steps from a dummy node to land on its predecessor and unlink the next node.
    tradeoff: The same O(sz) time and O(1) memory, and the most natural first idea. It just walks the list twice; the gap technique answers the one-pass follow-up and is a pattern that comes up again (middle of a list, cycle detection).
    code: |
      class Solution:
          def removeNthFromEnd(self, head: Optional[ListNode], n: int) -> Optional[ListNode]:
              length = 0
              node = head
              while node:
                  length += 1
                  node = node.next

              dummy = ListNode(0, head)
              prev = dummy
              for _ in range(length - n):  # stop right before the node to delete
                  prev = prev.next
              prev.next = prev.next.next
              return dummy.next

