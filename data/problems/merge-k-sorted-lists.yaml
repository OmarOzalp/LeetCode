id: "23"
title: Merge k Sorted Lists
slug: merge-k-sorted-lists
leetcode_url: https://leetcode.com/problems/merge-k-sorted-lists/
category: linked-list
difficulty: Hard
patterns: [Linked List, Min-Heap, K-way Merge, Divide and Conquer, Dummy Node]

description: |
  You are given an array `lists` of `k` linked lists, each sorted in ascending order. Some of them may be empty.

  Merge all of them into **one sorted linked list** and return its head.

  Each list is shown as an array of node values, so `lists` looks like `[[1, 4, 5], [1, 3, 4]]`. An empty inner array is an empty list (`None`).

examples:
  - input: { lists: [[1, 4, 5], [1, 3, 4], [2, 6]] }
    output: [1, 1, 2, 3, 4, 4, 5, 6]
    explanation: All eight nodes from the three lists end up in one sorted list.
  - input: { lists: [] }
    output: []
    explanation: There are no lists at all, so the result is empty.
  - input: { lists: [[]] }
    output: []
    explanation: There is one list, and it is empty.

constraints:
  - "`k == lists.length`"
  - "`0 <= k <= 10^4`"
  - "`0 <= lists[i].length <= 500`"
  - "`-10^4 <= lists[i][j] <= 10^4`"
  - "`lists[i]` is sorted in ascending order."
  - "The total number of nodes across all lists does not exceed `10^4`."

function_signature: "def mergeKLists(self, lists: List[Optional[ListNode]]) -> Optional[ListNode]"

starter_code: |
