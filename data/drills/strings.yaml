# Re-run scripts/import-codetogo.ts to refresh; edits here will be overwritten.
id: strings
title: Strings
group: Python
order: 7
blurb: "Immutable text: join, split, slicing and char math."
intro: Strings are immutable sequences of characters. Indexing and slicing work like lists, but every "change" builds a new string, so collect pieces in a list and join once.
methods:
  - id: strings-join
    name: "''.join(parts)"
    summary: Glue a list of strings together with a separator.
    example: |-
      parts = []
      for ch in 'abc':
          parts.append(ch.upper())   # O(1) each
      print(''.join(parts))
      print('-'.join(['2024', '01', '05']))
      print(', '.join(map(str, [1, 2, 3])))
      s = 'hi'                       # s[0] = 'H' fails
      print('H' + s[1:])             # build a new one
    output: |-
      ABC
      2024-01-05
      1, 2, 3
      Hi
    complexity: O(total length)
    tip: "`s += ch` inside a loop can copy the whole string each time (O(n^2)). Append to a list and `''.join` it at the end. `join` only accepts strings, so `map(str, nums)` first."
  - id: strings-split
    name: split() / split(sep)
    summary: Break a string into a list of pieces.
    example: |-
      print('  a  b c '.split())     # any whitespace
      print('a,b,,c'.split(','))     # keeps empties
      print('k=v=w'.split('=', 1))   # at most 1 split
      words = 'the sky is blue'.split()
      print(' '.join(reversed(words)))
    output: |-
      ['a', 'b', 'c']
      ['a', 'b', '', 'c']
      ['k', 'v=w']
      blue is sky the
    complexity: O(n)
    tip: "`split()` with no argument collapses runs of whitespace and ignores leading/trailing spaces. `split(' ')` does not, and can return empty strings."
  - id: strings-strip
    name: strip() / lstrip() / rstrip()
    summary: Trim characters from the ends (whitespace by default).
    example: |-
      s = '  hello!  '
      print(repr(s.strip()))
      print(repr(s.lstrip()), repr(s.rstrip()))
      print('xxhixx'.strip('x'))     # chars to trim
      print('007'.lstrip('0'))
    output: |-
      'hello!'
      'hello!  ' '  hello!'
      hi
      7
    complexity: O(n)
    tip: "The argument is a SET of characters, not a prefix: `'abcba'.strip('ab')` is `'c'`. Use `removeprefix` / `removesuffix` to drop an exact substring."
  - id: strings-case-checks
    name: lower / upper / isalnum / isalpha / isdigit
    summary: Normalize case and classify characters.
    example: |-
      s = 'A man, a plan!'
      clean = [c.lower() for c in s if c.isalnum()]
      print(''.join(clean))
      print('abc'.isalpha(), 'ab1'.isalpha())
      print('42'.isdigit(), '-4'.isdigit())
      print('Hi'.upper(), 'Hi'.lower())
    output: |-
      amanaplan
      True False
      True False
      HI hi
    complexity: O(n)
    tip: "Valid Palindrome: keep `isalnum()` characters, lowercase them, compare with the reverse. `isdigit()` is False for `-4` and `3.5`, so it does not validate numbers."
  - id: strings-ord-chr
    name: ord(c) / chr(n)
    summary: Convert between a character and its code point.
    example: |-
      print(ord('a'), ord('A'), chr(98))
      counts = [0] * 26
      for c in 'hello':
          counts[ord(c) - ord('a')] += 1
      print(counts[ord('l') - ord('a')])   # 'l' count
      nxt = (ord('z') - ord('a') + 1) % 26
      print(chr(nxt + ord('a')))           # wraps to 'a'
    output: |-
      97 65 b
      2
      a
    complexity: O(1)
    tip: A 26-slot list indexed by `ord(c) - ord('a')` is a fast fixed-size counter for lowercase letters, and `tuple(counts)` makes an O(k) anagram key.
  - id: strings-find
    name: find / index / count / in
    summary: Search for a substring.
    example: |-
      s = 'banana'
      print(s.find('an'), s.find('x'))   # -1 if missing
      print(s.index('an'))   # ValueError if missing
      print(s.rfind('an'))   # last match
      print(s.count('a'), s.count('ana'))
      print('nan' in s)
    output: |-
      1 -1
      1
      3
      3 1
      True
    complexity: O(n) typical
    tip: "`find` returns -1 and `index` raises ValueError - and -1 is a valid index, so check it. `count` skips overlapping matches: `'aaa'.count('aa')` is 1."
  - id: strings-replace
    name: replace / startswith / endswith
    summary: Substitute substrings and test prefixes or suffixes.
    example: |-
      s = 'a-b-c'
      print(s.replace('-', ''))       # every match
      print(s.replace('-', '+', 1))   # first only
      print(s)                        # unchanged
      print('pic.png'.endswith(('.png', '.jpg')))
      print('flower'.startswith('flo'))
    output: |-
      abc
      a+b-c
      a-b-c
      True
      True
    complexity: O(n)
    tip: String methods return a NEW string; forgetting `s = s.replace(...)` is a common bug. `startswith` / `endswith` accept a tuple of options.
  - id: strings-reverse-repeat
    name: s[::-1] and s * n
    summary: Reverse, step through or repeat a string.
    example: |-
      s = 'racecar'
      print(s[::-1] == s)        # palindrome check
      print('ab' * 3)
      print('-' * 10)
      print('abc'[::-1], 'abcdef'[1::2])
    output: |-
      True
      ababab
      ----------
      cba bdf
    complexity: O(n)
    tip: "`s == s[::-1]` costs O(n) extra space. If asked for O(1) space, walk two pointers inward from both ends."
  - id: strings-fstrings
    name: f'{x:.2f}', f'{n:08b}'
    summary: Format values inline with f-strings and format specs.
    example: |-
      x, n, name = 3.14159, 5, 'ab'
      print(f'{x:.2f}')            # 2 decimals
      print(f'{n:08b}')            # binary, 8 wide
      print(f'{n:>4}|{name:<4}|')  # align right/left
      print(f'{255:x} {1234567:,}')
      print(f'{x=}')               # debug form
    output: |-
      3.14
      00000101
         5|ab  |
      ff 1,234,567
      x=3.14159
    complexity: O(length of result)
    tip: "`f'{n:b}'` gives binary without the `0b` prefix, and a width like `08b` zero-pads it. `f'{x=}'` prints the name and value for quick debugging."
  - id: strings-constants
    name: string.ascii_lowercase & friends
    summary: Ready-made alphabets from the `string` module.
    example: |-
      import string
      abc = string.ascii_lowercase
      print(abc)
      print(string.digits)
      print(string.ascii_uppercase[:3])
      pos = {c: i for i, c in enumerate(abc)}
      print(pos['z'])
    output: |-
      abcdefghijklmnopqrstuvwxyz
      0123456789
      ABC
      25
    complexity: O(1)
    tip: "Word Ladder style problems try every one-letter change with `for c in string.ascii_lowercase`. Also handy: `string.ascii_letters` and `string.punctuation`."
quiz:
  - id: strings-q1
    question: What does this print?
    code: |-
      s = 'hello'
      s.upper()
      print(s)
    options:
      - HELLO
      - hello
      - None
    answer: 1
    explanation: "Strings are immutable: `upper()` returns a new string, which is thrown away here. Write `s = s.upper()`."
  - id: strings-q2
    question: What does this print?
    code: print('a,,b'.split(','))
    options:
      - "['a', 'b']"
      - "['a', '', 'b']"
      - "['a', ',', 'b']"
    answer: 1
    explanation: Splitting on an explicit separator keeps the empty string between two adjacent commas.
  - id: strings-q3
    question: What does this print?
    code: print(ord('d') - ord('a'))
    options:
      - "3"
      - "4"
      - "'d'"
      - TypeError
    answer: 0
    explanation: Letters have consecutive code points, so this maps a-z to 0-25 and gives 3 for d.
  - id: strings-q4
    question: You build a result one character at a time in a loop. What is the efficient way?
    options:
      - res += ch each time
      - Append to a list, then ''.join(it)
      - res = ch + res each time
    answer: 1
    explanation: Strings are immutable, so repeated concatenation can copy the whole string every step (O(n^2)). Joining a list once is O(n).
  - id: strings-q5
    question: What does this print?
    code: print(f'{6:04b}', 'ab'.find('z'))
    options:
      - 0110 -1
      - 110 -1
      - 0110 ValueError
      - 0006 -1
    answer: 0
    explanation: "`04b` is binary zero-padded to 4 digits, and `find` returns -1 for a missing substring (`index` would raise)."
  - id: strings-q6
    question: What does this print?
    code: print('aaaa'.count('aa'))
    options:
      - "2"
      - "3"
      - "1"
    answer: 0
    explanation: "`count` finds non-overlapping matches only: positions 0 and 2."
drills:
  - id: strings-d-join-space
    method: strings-join
    title: Join words with spaces
    task: Combine the list of words into one string with a single space between each word.
    setup: words = ["code", "to", "go"]
    line: sentence = ___
    answer: '" ".join(words)'
    accept:
      - "' '.join(words)"
    decoys:
      - words.join(" ")
      - '"".join(words)'
      - '" ".join(*words)'
    show: sentence
    expected: "'code to go'"
    hint: "`join` is a method on the **separator** string, and it takes the list."
    explain: '`sep.join(items)` glues the items together with `sep` between them in O(total length). Lists have no `.join`, so `words.join(" ")` raises an AttributeError.'
  - id: strings-d-join-nums
    method: strings-join
    title: Join numbers
    task: Turn the list of ints into one comma-separated string.
    setup: nums = [1, 2, 3]
    line: s = ___
    answer: '",".join(map(str, nums))'
    accept:
      - '",".join(str(x) for x in nums)'
      - '",".join([str(x) for x in nums])'
    decoys:
      - '",".join(nums)'
      - str(nums)
      - '",".join(str(nums))'
    show: s
    expected: "'1,2,3'"
    hint: "`join` only accepts strings, so convert the numbers first."
    explain: '`map(str, nums)` turns each int into a string before joining. `",".join(nums)` raises TypeError, and `str(nums)` gives `"[1, 2, 3]"` with brackets and spaces.'
  - id: strings-d-reverse-words
    method: strings-split
    title: Reverse the words
    task: Reverse the word order, with one space between words and none at the ends.
    setup: s = '  the sky  is blue '
    line: out = " ".join(___)
    answer: s.split()[::-1]
    accept:
      - reversed(s.split())
    decoys:
      - s.split(' ')[::-1]
      - s[::-1].split()
      - s.split()
    show: out
    expected: "'blue is sky the'"
    hint: Split with no argument treats any run of whitespace as one separator.
    explain: '`split()` with no argument ignores leading and trailing spaces and collapses runs, giving clean words. `split(" ")` keeps empty strings for repeated spaces, which turn into extra spaces after the join.'
  - id: strings-d-strip-zeros
    method: strings-strip
    title: Trim leading zeros
    task: Remove the leading zeros from the digit string.
    setup: num = '000420'
    line: n = ___
    answer: num.lstrip('0')
    accept:
      - str(int(num))
    decoys:
      - num.strip('0')
      - num.removeprefix('0')
      - num.lstrip(0)
    show: n
    expected: "'420'"
    hint: Only one end should be trimmed.
    explain: '`lstrip(chars)` removes any of those characters from the left end only; `strip` trims both ends and eats the trailing 0 too. The argument is a set of characters, while `removeprefix("0")` drops exactly one `"0"`.'
  - id: strings-d-alnum-clean
    method: strings-case-checks
    title: Keep letters and digits
    task: "Valid Palindrome prep: keep only letters and digits, lowercased."
    setup: s = 'Agent 007, go!'
    line: clean = [c.lower() for c in s ___]
    answer: if c.isalnum()
    decoys:
      - if c.isalnum
      - if c.isalpha()
      - if not c.isspace()
    show: '"".join(clean)'
    expected: "'agent007go'"
    hint: One check covers letters and digits together. Remember to call it.
    explain: "`isalnum()` is True for letters and digits, so spaces and punctuation are dropped. Without parentheses, `c.isalnum` is a method object, which is always truthy, and `isalpha()` would drop the digits."
  - id: strings-d-letter-slot
    method: strings-ord-chr
    title: Letter to index
    task: Count `c` in a 26-slot list where `a` is slot 0 and `z` is slot 25.
    setup: |-
      counts = [0] * 26
      c = 'd'
    line: counts[___] += 1
    answer: ord(c) - ord('a')
    accept:
      - ord(c) - 97
    decoys:
      - ord(c)
      - c - 'a'
      - ord('a') - ord(c)
    show: counts.index(1)
    expected: "3"
    hint: Letters have consecutive code points. Subtract the code of the first letter.
    explain: '`ord(c) - ord("a")` maps `a`..`z` to 0..25, which turns a list into a fast fixed-size counter. `ord(c)` alone is 100 (out of range), and Python cannot subtract strings.'
  - id: strings-d-shift-letter
    method: strings-ord-chr
    title: Shift a letter
    task: Shift the lowercase letter `c` forward by `k`, wrapping past `z` back to `a`.
    setup: c, k = 'y', 3
    line: out = chr(___)
    answer: (ord(c) - 97 + k) % 26 + 97
    accept:
      - (ord(c) - ord('a') + k) % 26 + ord('a')
    decoys:
      - ord(c) + k
      - (ord(c) + k) % 26
      - (ord(c) - 97 + k) % 26
    show: out
    expected: "'b'"
    hint: Move to 0-25 first, wrap with `%`, then move back.
    explain: Subtracting 97 (`ord("a")`) puts letters in 0..25, `% 26` wraps around, and adding 97 converts back for `chr`. Taking `% 26` of the raw code point lands on an unprintable character instead.
  - id: strings-d-find-or-minus1
    method: strings-find
    title: Search without crashing
    task: Get the first position of each pattern in `s`, or -1 when it does not occur.
    setup: |-
      s = 'banana'
      pats = ['an', 'x']
    line: pos = [___ for p in pats]
    answer: s.find(p)
    decoys:
      - s.index(p)
      - p.find(s)
      - s.count(p)
    show: pos
    expected: "[1, -1]"
    hint: Of the two search methods, only one reports a miss without an exception.
    explain: "`find` returns -1 when the substring is missing, while `index` raises ValueError. Careful: -1 is also a valid list index, so test `!= -1` before using the result."
  - id: strings-d-replace-assign
    method: strings-replace
    title: Remove every dash
    task: Remove all dashes so that `s` itself ends up as the cleaned string.
    setup: s = 'a-b-c'
    line: ___
    answer: s = s.replace('-', '')
    accept:
      - s = ''.join(s.split('-'))
    decoys:
      - s.replace('-', '')
      - s = s.strip('-')
      - s = s.replace('-', '', 1)
    show: s
    expected: "'abc'"
    hint: "Strings are immutable: their methods return a new string."
    explain: "`replace(old, new)` swaps every match but returns a **new** string, so assign it back. Without `s = ` nothing changes, `strip` only trims the ends, and a count of 1 replaces just the first dash."
  - id: strings-d-palindromes
    method: strings-reverse-repeat
    title: Palindrome check
    task: Keep only the words that read the same forwards and backwards.
    setup: words = ['level', 'lever', 'noon']
    line: pals = [w for w in words if ___]
    answer: w == w[::-1]
    accept:
      - w == ''.join(reversed(w))
    decoys:
      - w == reversed(w)
      - w[::-1]
      - w == w.reverse()
    show: pals
    expected: "['level', 'noon']"
    hint: A slice with step -1 gives a reversed copy of a string.
    explain: "`w[::-1]` is a reversed copy, so comparing it with `w` checks for a palindrome in O(n) time and space. `reversed(w)` is an iterator (never equal to a string) and strings have no `.reverse()`. For O(1) space, walk two pointers inward."
  - id: strings-d-binary-pad
    method: strings-fstrings
    title: Zero-padded binary
    task: Format `n` as an 8-digit binary string, padded with zeros on the left.
    setup: n = 5
    line: bits = f"{___}"
    answer: n:08b
    accept:
      - n:0>8b
    decoys:
      - n:b
      - n:8b
      - bin(n)
    show: bits
    expected: "'00000101'"
    hint: "After the colon: a 0 fill, a width of 8, then the type `b`."
    explain: "`:08b` means binary (`b`), width 8, padded with zeros (`0`). `:8b` pads with spaces, and `bin(n)` adds a `0b` prefix without padding."
  - id: strings-d-alphabet
    method: strings-constants
    title: Try every letter
    task: "Word Ladder: build every word made by putting each letter a-z in front of `word[1:]`."
    setup: |-
      import string
      word = 'hit'
    line: nbrs = [c + word[1:] for c in ___]
    answer: string.ascii_lowercase
    accept:
      - "'abcdefghijklmnopqrstuvwxyz'"
    decoys:
      - string.ascii_letters
      - string.lowercase
      - string.ascii_uppercase
    show: (len(nbrs), nbrs[0], nbrs[-1])
    expected: (26, 'ait', 'zit')
    hint: The `string` module has a ready-made constant for the 26 lowercase letters.
    explain: '`string.ascii_lowercase` is `"abcdefghijklmnopqrstuvwxyz"`. `ascii_letters` adds the uppercase letters too (52 items), and `string.lowercase` was removed with Python 2.'
